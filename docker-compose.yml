services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: gym
      POSTGRES_PASSWORD: gympass
      POSTGRES_DB: badminton
      TZ: UTC
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gym -d badminton"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      HTTP_ADDR: ":8080"
      DATABASE_URL: "postgres://gym:gympass@postgres:5432/badminton?sslmode=disable"
      REDIS_ADDR: "redis:6379"
      TOKEN_SECRET: "gym-badminton-dev-secret"
      # 演示/验证环境开启虚拟时钟与内置周期任务；生产部署请置 ALLOW_TEST_CLOCK=false
      ALLOW_TEST_CLOCK: "true"
    ports:
      - "8080:8080"

volumes:
  pgdata:
  redisdata:
