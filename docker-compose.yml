services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: courtbook
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d courtbook"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      HTTP_ADDR: ":8080"
      DATABASE_URL: "postgres://postgres:postgres@db:5432/courtbook?sslmode=disable"
      REDIS_ADDR: "redis:6379"
      MIGRATE_ON_START: "true"
      DEVICE_KEY: "device-key-123"
      # 自动化验证/演示时间逻辑时改为 true（生产保持 false）
      ENABLE_TEST_CLOCK: "true"
      TZ: "Asia/Shanghai"
    ports:
      - "8080:8080"

volumes:
  pgdata:
